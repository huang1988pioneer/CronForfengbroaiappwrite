name: CronAppwrite table

on:
  schedule:
    # Taiwan 08:33: clear CronAppwrite before the day's first run.
    - cron: "33 0 * * *"
    # Taiwan 09:33: run the daily add/delete cycle.
    - cron: "33 1 * * *"
    # Taiwan 20:33: clear CronAppwrite after the day's final run.
    - cron: "33 12 * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "CronAppwrite operation"
        required: true
        default: "cycle"
        type: choice
        options:
          - cycle
          - add
          - remove
          - clear
      period:
        description: "period label for a manual add"
        required: false
        default: "manual"
        type: choice
        options:
          - manual
          - morning
          - afternoon
          - evening

permissions:
  contents: read

concurrency:
  group: cronappwrite-table
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
      APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
      APPWRITE_DATABASE_ID: ${{ secrets.APPWRITE_DATABASE_ID }}
      APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
      NEXT_PUBLIC_APPWRITE_ENDPOINT: ${{ secrets.NEXT_PUBLIC_APPWRITE_ENDPOINT }}
      NEXT_PUBLIC_APPWRITE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_APPWRITE_PROJECT_ID }}
      NEXT_PUBLIC_APPWRITE_DATABASE_ID: ${{ secrets.NEXT_PUBLIC_APPWRITE_DATABASE_ID }}
      NEXT_PUBLIC_APPWRITE_API_KEY: ${{ secrets.NEXT_PUBLIC_APPWRITE_API_KEY }}
      APPWRITE_CRON_COLLECTION_NAME: CronAppwrite

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Ensure CronAppwrite collection
        run: npm run cronappwrite:ensure

      - name: Run daily three-write cycle
        if: github.event.schedule == '33 1 * * *' || github.event.inputs.action == 'cycle'
        env:
          APPWRITE_CRON_INTERVAL_MS: "180000"
          APPWRITE_CRON_ADD_COUNT: "3"
          APPWRITE_CRON_MAX_DOCUMENTS: "33"
          APPWRITE_CRON_DELETE_BATCH_SIZE: "3"
          APPWRITE_CRON_DELETE_BATCH_COUNT: "3"
        run: npm run cronappwrite:cycle

      - name: Clear CronAppwrite at the first and last daily run
        if: github.event.schedule == '33 0 * * *' || github.event.schedule == '33 12 * * *'
        env:
          CLEAR_FORCE: "1"
          APPWRITE_CRON_AUTO_ENSURE: "0"
        run: npm run cronappwrite:clear

      - name: Run manual single-row operation
        if: github.event_name == 'workflow_dispatch' && (github.event.inputs.action == 'add' || github.event.inputs.action == 'remove')
        env:
          ROUTINE_CRON_ACTION: ${{ github.event.inputs.action }}
          APPWRITE_CRON_PERIOD: ${{ github.event.inputs.period || 'manual' }}
          APPWRITE_CRON_AUTO_ENSURE: "0"
        run: npm run cronappwrite:cron

      - name: Run manual full clear
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'clear'
        env:
          CLEAR_FORCE: "1"
          APPWRITE_CRON_AUTO_ENSURE: "0"
        run: npm run cronappwrite:clear
